<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=5.0,
      user-scalable=yes">

<title>IRCTC Document</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    overflow-x: hidden;
}

.document {
    width: 100%;
    margin: 0;
    padding: 0;
}

.document img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
}
</style>
</head>

<body>

<div class="document">

    <img src="1.jpeg" alt="Document Page 1">

    <img src="2.jpeg" alt="Document Page 2">

    <img src="3.jpeg" alt="Document Page 3">

</div>

</body>
</html>
